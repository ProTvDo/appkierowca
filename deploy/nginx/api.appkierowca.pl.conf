# Bezpośrednie wejście do API — przydatne do diagnostyki i przyszłych
# klientów spoza przeglądarki (np. aplikacja mobilna).
#
# Uwaga: aplikacja webowa NIE korzysta z tego adresu — chodzi po /api
# na app.appkierowca.pl, w tym samym origin. Wejście tędy podlega CORS,
# więc adres frontendu musi być wymieniony w CORS_ORIGINS w api/.env.
#
# Certyfikat: certbot --nginx -d api.appkierowca.pl

server {
    listen 80;
    listen [::]:80;
    server_name api.appkierowca.pl;

    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/api.appkierowca.pl.access.log;
    error_log  /var/log/nginx/api.appkierowca.pl.error.log;

    # Backend sam obsługuje prefiks /api, więc przekazujemy ścieżkę bez zmian
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
