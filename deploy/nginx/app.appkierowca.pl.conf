# Aplikacja dla kierowców — statyczny build Vite + proxy /api do backendu.
# Dzięki proxy frontend i API są w tym samym origin, więc CORS nie wchodzi w grę.
#
# Certyfikat: certbot --nginx -d app.appkierowca.pl
# (certbot dopisze sekcję listen 443 i przekierowanie z portu 80)

server {
    listen 80;
    listen [::]:80;
    server_name app.appkierowca.pl;

    root /var/www/appkierowca/pwa/dist;
    index index.html;

    # Cloudflare stoi przed serwerem — logujmy prawdziwy adres klienta
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/app.appkierowca.pl.access.log;
    error_log  /var/log/nginx/app.appkierowca.pl.error.log;

    # Backend Node — tylko lokalnie, nigdy wystawiony wprost na świat
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Zasoby z hashem w nazwie (Vite) — można trzymać długo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifest i service worker muszą być zawsze świeże,
    # inaczej użytkownicy zostają na starej wersji aplikacji
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # SPA — każda ścieżka obsługiwana przez routing po stronie Reacta
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
